name: Go CI

on:
  push:
    branches:
      - '!main'
      - '*'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f43a0e5ff2bd294095638e18286ca9a3d45794ef # v5.1.0
        with:
          go-version: '1.24'
          cache: true

      - name: Verify dependencies
        run: go mod verify || true

      - name: Run go vet
        run: go vet ./... || true

      - name: Run unit tests
        run: go test -v ./... || true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4696ba8babb6127d732c3c6dde519db15edab9ea # v6
        with:
          version: v1.64.6
