name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*'
      - 'dev*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Determine Build Environment
        id: build_env
        run: |
          if [[ "${{ github.ref_name }}" == dev* ]]; then
            VERSION="${GITHUB_REF_NAME#dev}"
            VERSION="${VERSION#=}"
            VERSION="${VERSION#-}"
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "Building dev version: ${VERSION}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "env=production" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "Building production version: ${VERSION}"
          else
            echo "env=production" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "Building default version: ${GITHUB_REF_NAME}"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/calendarr
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.build_env.outputs.version }}
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ steps.build_env.outputs.env == 'production' }}
            type=raw,value=dev,enable=${{ steps.build_env.outputs.env == 'dev' }}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.environment=${{ steps.build_env.outputs.env }}
            org.opencontainers.image.version=${{ steps.build_env.outputs.version }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENVIRONMENT=${{ steps.build_env.outputs.env }}
            VERSION=${{ steps.build_env.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: false
          provenance: false
          sbom: false

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
