name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.5.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit tests
        run: go test -v ./...

      - name: Extract Release Notes from CHANGELOG
        id: extract_notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          fi
          VERSION="${TAG#v}"

          python3 -c "
          import sys, re
          ver = sys.argv[1]
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          pattern = r'## \[' + re.escape(ver) + r'\].*?\n(?=## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              body = re.sub(r'^## \[[^\n]+\n+', '', match.group(0)).strip()
              with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
                  out.write(body + '\n')
          else:
              with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
                  out.write('## What\'s Changed\n\nAutomated release for ' + ver + '\n')
          " "$VERSION"

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.extract_notes.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, updating release notes..."
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md --verify-tag
          fi
